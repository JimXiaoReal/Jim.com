<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Portfolio</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="page-shell">
    <header class="site-header">
      <div>
        <p class="eyebrow">Portfolio</p>
        <h1 id="name">Your Name</h1>
        <p id="title">Your Title</p>
      </div>
      <nav class="site-nav">
        <a href="#about">About</a>
        <a href="#experiences">Experience</a>
        <a href="#awards">Awards</a>
        <a href="#small-awards">Small Awards</a>
        <a href="#activities">Activities</a>
        <a href="#contact">Contact</a>
        <a href="admin.html">Admin</a>
      </nav>
    </header>

    <main>
      <section id="about" class="section card">
        <h2>About</h2>
        <p id="intro"></p>
      </section>

      <section id="experiences" class="section card">
        <div class="section-header"><h2>Experience</h2></div>
        <div id="experiences-list" class="grid"></div>
      </section>

      <section id="awards" class="section card">
        <div class="section-header"><h2>Awards</h2></div>
        <div id="awards-list" class="grid"></div>
      </section>

      <section id="small-awards" class="section card">
        <div class="section-header"><h2>Small Awards</h2></div>
        <div id="small-awards-list" class="small-awards-list"></div>
      </section>

      <section id="activities" class="section card">
        <div class="section-header"><h2>Activities</h2></div>
        <div id="activities-list" class="grid"></div>
      </section>

      <section id="contact" class="section card contact-card">
        <h2>Contact</h2>
        <p id="contact-copy"></p>
        <div class="contact-list" id="contact-list"></div>
      </section>
    </main>
  </div>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
